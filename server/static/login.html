<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · PianoVal</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#f3f7f7;color:#203940;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}.login{width:100%;max-width:400px;background:white;border:1px solid #dce6e7;border-radius:16px;padding:36px;box-shadow:0 12px 40px #2039400a}.brand{font-size:29px;font-weight:750;letter-spacing:-1px}.brand span{color:#1a7c72}h1{font-size:21px;margin-top:28px}p{color:#637a80;line-height:1.7}label{display:block;margin-top:18px;font-weight:600}input{display:block;width:100%;height:46px;margin-top:8px;border:1px solid #c9d8db;border-radius:7px;padding:0 12px;font:inherit}input:focus{outline:2px solid #b7e4dc;border-color:#1a7c72}button{width:100%;margin-top:24px;border:0;border-radius:7px;background:#1a7c72;color:white;min-height:46px;font:inherit;font-weight:600;cursor:pointer}.error{color:#b63c37;min-height:22px;margin:12px 0 0}.hint{font-size:12px;margin-bottom:0}
</style>
</head>
<body><main class="login">
<div class="brand">PianoVal<span>.</span></div>
<h1>登录钢琴识别工作台</h1><p>使用老师测试账号登录，开始听琴与复核。</p>
<form method="post" action="{{ACTION}}">
<input name="next" type="hidden" value="{{NEXT}}">
<label>账号<input name="username" autocomplete="username" required maxlength="128" autocapitalize="none" spellcheck="false"></label>
<label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
<p class="error" role="alert">{{ERROR}}</p><button type="submit">登录</button>
</form>
<p class="hint">测试结束后，可在工作台右上角退出登录。</p>
</main>
<script>
// URL fragments stay in the browser; preserve the selected workspace after login.
const next=document.querySelector('[name="next"]');
if(location.hash&&!next.value.includes('#'))next.value+=location.hash;
</script>
</body></html>
